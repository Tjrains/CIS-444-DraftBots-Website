<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Browser tab title -->
  <title>DraftBots</title>

  <!-- Google Fonts used by the app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Main JavaScript file, loaded after HTML is parsed -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Top header with logo, balance, and logout button -->
  <header>
    <div class="logo">
      <span class="logo-icon">✓✓</span>
      <span class="logo-text">DraftBots</span>
    </div>

    <!-- Header balance updates from script.js -->
    <div style="display: flex; align-items: center; gap: 20px;">
      <div class="header-balance" id="headerBalance">Balance: $0.00</div>

      <!-- Logs the user out by clearing sessionStorage -->
      <button onclick="logout()" style="
        background: none;
        border: 1px solid #2a3040;
        color: #7a8499;
        padding: 6px 14px;
        border-radius: 6px;
        font-family: 'Barlow', sans-serif;
        font-size: 13px;
        cursor: pointer;
      ">Log Out</button>
    </div>
  </header>

  <!-- Navigation tabs that switch between app sections -->
  <nav>
    <button class="tab active" onclick="openTab('schedule', this)">Schedule</button>
    <button class="tab" onclick="openTab('teams', this)">Teams</button>
    <button class="tab" onclick="openTab('bets', this)">My Bets</button>
    <button class="tab" onclick="openTab('profile', this)">Profile</button>
  </nav>

  <main>

    <!-- Schedule tab: list of games gets inserted here by JavaScript -->
    <section id="schedule" class="tab-content active">
      <h2 class="section-title">Upcoming Games</h2>
      <div id="gameList" class="game-grid"></div>
    </section>

    <!-- Game details page shown after clicking a game card -->
    <section id="gameDetails" class="tab-content hidden">
      <button class="back-btn" onclick="goBack()">← Back to Schedule</button>
      <h2 id="gameTitle" class="section-title"></h2>
      <div id="gameStatusBadge"></div>
      <div id="gameContent" class="game-content"></div>
    </section>

    <!-- Teams tab: team cards are generated by JavaScript -->
    <section id="teams" class="tab-content">
      <h2 class="section-title">Teams</h2>
      <div id="teamGrid" class="team-grid"></div>
    </section>

    <!-- My Bets tab: user's placed bets are loaded here -->
    <section id="bets" class="tab-content">
      <h2 class="section-title">My Bets</h2>
      <div id="betsList">
        <p class="empty-msg">No bets placed yet. Head to the Schedule to place a bet!</p>
      </div>
    </section>

    <!-- Profile tab: user information, balance, add funds, and transactions -->
    <section id="profile" class="tab-content">
      <h2 class="section-title">Profile</h2>

      <!-- User profile card -->
      <div class="profile-card">
        <div class="profile-header">

          <!-- Avatar uses the user's first initial -->
          <div class="avatar" id="avatarInitial">?</div>

          <!-- Profile text loaded from backend -->
          <div class="profile-meta">
            <p class="profile-username" id="username">Loading...</p>
            <p class="profile-email" id="email"></p>
            <span class="status-badge" id="status"></span>
          </div>
        </div>

        <!-- User balance and account creation date -->
        <div class="profile-stats">
          <div class="stat-box">
            <span class="stat-label">Balance</span>
            <span class="stat-value green" id="balance">$0.00</span>
          </div>

          <div class="stat-box">
            <span class="stat-label">Member Since</span>
            <span class="stat-value" id="createdAt">—</span>
          </div>
        </div>
      </div>

      <!-- Add funds demo section -->
      <div class="add-funds-card">
        <h3 class="sub-title">Add Funds</h3>

        <!-- User enters a fake deposit amount here -->
        <div class="add-funds-row">
          <input
            type="number"
            id="addFundsAmount"
            min="1"
            step="0.01"
            placeholder="Enter amount"
          >

          <!-- Calls addFunds() in script.js -->
          <button onclick="addFunds()">Add Funds</button>
        </div>

        <!-- Success or error message appears here -->
        <p id="addFundsMsg" class="add-funds-msg"></p>
      </div>

      <!-- Transaction list loaded from backend -->
      <h3 class="sub-title">Recent Transactions</h3>
      <ul id="transactionList" class="transaction-list"></ul>
    </section>

  </main>

  <!-- Bet modal overlay.
       Hidden by default and opened when the user clicks a bet option. -->
  <div id="betModal" class="modal-overlay hidden">
    <div class="modal">

      <!-- Close modal button -->
      <button class="modal-close" onclick="closeBetModal()">×</button>

      <h3 class="modal-title">Place Bet</h3>

      <!-- Selected pick and game name are filled by JavaScript -->
      <p class="modal-pick" id="modalPick"></p>
      <p class="modal-game" id="modalGame"></p>

      <!-- Displays selected bet odds -->
      <div class="modal-row">
        <span>Odds</span>
        <span id="modalOdds">-110</span>
      </div>

      <!-- Wager input -->
      <label class="modal-label" for="betAmount">Wager Amount ($)</label>
      <input
        type="number"
        id="betAmount"
        min="1"
        step="0.01"
        placeholder="0.00"
        oninput="updatePayoutPreview()"
      >

      <!-- Live payout preview -->
      <div class="modal-row">
        <span>Potential Payout</span>
        <span id="modalPayout" class="positive">$0.00</span>
      </div>

      <!-- Validation or server errors appear here -->
      <p class="modal-error hidden" id="modalError"></p>

      <!-- Submits the bet to the backend -->
      <button class="modal-submit" id="modalSubmit" onclick="submitBet()">Place Bet</button>
    </div>
  </div>

</body>
</html>
