<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Basic page setup -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Browser tab title -->
  <title>DraftBots – Login</title>

  <!-- Google Fonts used throughout the app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================================
       COLOR VARIABLES
       =========================================================================
       Shared color palette used across the login page.
    */
    :root {
      --bg:     #0d0f14;
      --card:   #14181f;
      --border: #2a3040;
      --accent: #1e7fcb;
      --text:   #e8eaf0;
      --muted:  #7a8499;
      --green:  #2ecc71;
      --red:    #e74c3c;
    }

    /* Reset default browser spacing */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* =========================================================================
       PAGE LAYOUT
       =========================================================================
    */
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;

      /* Full screen centered layout */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================================
       LOGO
       =========================================================================
    */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .logo-icon {
      color: var(--accent);
      font-weight: 700;
      font-size: 20px;
    }

    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* =========================================================================
       AUTH CARD
       =========================================================================
       Main login/register container.
    */
    .auth-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    /* =========================================================================
       LOGIN / REGISTER TABS
       =========================================================================
    */
    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;

      color: var(--muted);

      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.8px;

      cursor: pointer;
      margin-bottom: -2px;
    }

    /* Active tab highlight */
    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* =========================================================================
       FORMS
       =========================================================================
    */

    /* Hidden by default */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    /* Shown when active */
    .auth-form.active {
      display: flex;
    }

    /* Form labels */
    label {
      font-size: 12px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.8px;

      color: var(--muted);

      margin-bottom: 4px;
      display: block;
    }

    /* Text input styling */
    input {
      width: 100%;
      padding: 10px 14px;

      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;

      color: var(--text);

      font-family: 'Barlow', sans-serif;
      font-size: 15px;
    }

    /* Blue outline when selected */
    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* =========================================================================
       SUBMIT BUTTONS
       =========================================================================
    */
    .submit-btn {
      width: 100%;
      padding: 12px;

      background-color: var(--accent);
      color: white;

      border: none;
      border-radius: 6px;

      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
      margin-top: 4px;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* =========================================================================
       SUCCESS / ERROR MESSAGES
       =========================================================================
    */
    .msg {
      font-size: 13px;
      text-align: center;

      padding: 8px;
      border-radius: 6px;

      /* Hidden by default, shown with JavaScript */
      display: none;
    }

    .msg.error {
      color: var(--red);
      background-color: rgba(231,76,60,0.1);
      border: 1px solid var(--red);
    }

    .msg.success {
      color: var(--green);
      background-color: rgba(46,204,113,0.1);
      border: 1px solid var(--green);
    }

  </style>
</head>

<body>

  <!-- =========================================================================
       LOGO
       =========================================================================
  -->
  <div class="logo">
    <span class="logo-icon">✓✓</span>
    <span class="logo-text">DraftBots</span>
  </div>

  <!-- =========================================================================
       LOGIN / REGISTER CARD
       =========================================================================
  -->
  <div class="auth-card">

    <!-- Login/Register tab switcher -->
    <div class="auth-tabs">

      <!-- Opens login form -->
      <button
        class="auth-tab active"
        onclick="switchTab('login', this)"
      >
        Login
      </button>

      <!-- Opens register form -->
      <button
        class="auth-tab"
        onclick="switchTab('register', this)"
      >
        Register
      </button>

    </div>

    <!-- =========================================================================
         LOGIN FORM
         =========================================================================
    -->
    <div id="loginForm" class="auth-form active">

      <!-- Username field -->
      <div>
        <label for="loginUsername">Username</label>

        <input
          type="text"
          id="loginUsername"
          placeholder="Enter your username"
        >
      </div>

      <!-- Password field -->
      <div>
        <label for="loginPassword">Password</label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
        >
      </div>

      <!-- Login button -->
      <button class="submit-btn" onclick="handleLogin()">
        Log In
      </button>

      <!-- Error/success message -->
      <p class="msg" id="loginMsg"></p>
    </div>

    <!-- =========================================================================
         REGISTER FORM
         =========================================================================
    -->
    <div id="registerForm" class="auth-form">

      <!-- Username -->
      <div>
        <label for="regUsername">Username</label>

        <input
          type="text"
          id="regUsername"
          placeholder="Choose a username"
        >
      </div>

      <!-- Email -->
      <div>
        <label for="regEmail">Email</label>

        <input
          type="email"
          id="regEmail"
          placeholder="Enter your email"
        >
      </div>

      <!-- Password -->
      <div>
        <label for="regPassword">Password</label>

        <input
          type="password"
          id="regPassword"
          placeholder="Choose a password"
        >
      </div>

      <!-- Register button -->
      <button class="submit-btn" onclick="handleRegister()">
        Create Account
      </button>

      <!-- Success/error message -->
      <p class="msg" id="registerMsg"></p>

    </div>

  </div>

  <script>

    // =========================================================================
    // API URL
    // =========================================================================
    // Automatically switches between local backend and deployed backend.
    const API =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1" ||
      window.location.protocol === "file:"
        ? "http://localhost:3000"
        : "https://draftbots.onrender.com";

    // =========================================================================
    // TAB SWITCHING
    // =========================================================================
    // Switches between Login and Register forms.
    function switchTab(tab, btn) {

      // Hide all forms.
      document.querySelectorAll('.auth-form')
        .forEach(f => f.classList.remove('active'));

      // Remove active state from all tabs.
      document.querySelectorAll('.auth-tab')
        .forEach(b => b.classList.remove('active'));

      // Show selected form.
      document.getElementById(tab + 'Form')
        .classList.add('active');

      // Highlight selected tab.
      btn.classList.add('active');
    }

    // =========================================================================
    // MESSAGE DISPLAY
    // =========================================================================
    // Shows success or error messages below forms.
    function showMsg(id, text, type) {

      const el = document.getElementById(id);

      el.textContent = text;
      el.className = 'msg ' + type;

      // Make message visible.
      el.style.display = 'block';
    }

    // =========================================================================
    // LOGIN
    // =========================================================================
    // Handles login requests to the backend.
    async function handleLogin() {

      // Read form values.
      const username =
        document.getElementById('loginUsername').value.trim();

      const password =
        document.getElementById('loginPassword').value;

      // Validate fields.
      if (!username || !password) {

        showMsg(
          'loginMsg',
          'Please fill in all fields.',
          'error'
        );

        return;
      }

      try {

        // Send login request to backend.
        const response = await fetch(`${API}/api/login`, {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            username,
            password
          })
        });

        // Parse backend response.
        const data = await response.json();

        // Login successful.
        if (response.ok) {

          // Save login session locally in browser.
          sessionStorage.setItem('loggedIn', 'true');
          sessionStorage.setItem('username', data.username);

          // Redirect to main app.
          window.location.href = 'index.html';

        } else {

          // Show login error.
          showMsg(
            'loginMsg',
            data.error || 'Login failed.',
            'error'
          );
        }

      } catch (err) {

        // Server connection failure.
        showMsg(
          'loginMsg',
          'Could not connect to server.',
          'error'
        );
      }
    }

    // =========================================================================
    // REGISTER
    // =========================================================================
    // Handles account creation requests.
    async function handleRegister() {

      // Read form values.
      const username =
        document.getElementById('regUsername').value.trim();

      const email =
        document.getElementById('regEmail').value.trim();

      const password =
        document.getElementById('regPassword').value;

      // Validate required fields.
      if (!username || !email || !password) {

        showMsg(
          'registerMsg',
          'Please fill in all fields.',
          'error'
        );

        return;
      }

      try {

        // Send registration request.
        const response = await fetch(`${API}/api/register`, {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            username,
            email,
            password
          })
        });

        // Parse backend response.
        const data = await response.json();

        // Registration successful.
        if (response.ok) {

          showMsg(
            'registerMsg',
            'Account created! Redirecting to login...',
            'success'
          );

          // Wait briefly then switch back to login form.
          setTimeout(() => {

            switchTab(
              'login',
              document.querySelectorAll('.auth-tab')[0]
            );

          }, 1500);

        } else {

          // Show registration error.
          showMsg(
            'registerMsg',
            data.error || 'Registration failed.',
            'error'
          );
        }

      } catch (err) {

        // Server connection failure.
        showMsg(
          'registerMsg',
          'Could not connect to server.',
          'error'
        );
      }
    }

  </script>

</body>
</html>
